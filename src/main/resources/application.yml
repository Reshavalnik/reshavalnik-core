spring:
  application:
    name: Reshavalnik
  data:
    mongodb:
      uri: ${MONGO_URL}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

          facebook:
            client-id: ${FACEBOOK_CLIENT_ID}
            client-secret: ${FACEBOOK_CLIENT_SECRET}
            scope:
              - public_profile
              - email

        provider:
          facebook:
            authorization-uri: https://www.facebook.com/v18.0/dialog/oauth
            token-uri: https://graph.facebook.com/v18.0/oauth/access_token
            user-info-uri: https://graph.facebook.com/me?fields=id,name,email,picture
            user-name-attribute: id
server:
  port: 8080

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html

sentry:
  dsn: ${SENTRY_DNS}
  traces-sample-rate: 1.0

jwt:
  secret:
    key: reshavalnikreshavalnikreshavalnikreshavalnikreshavalnikreshavalnikreshavalnikreshavalnikreshavalnikreshavalnik
    jwtExpirationMs: 155520000000

temp:
  file:
    path: ./app/temp-cache